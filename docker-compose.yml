name: inventory-saas

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Superuser, used only by tooling and the init script. The application
      # connects as the unprivileged `inventory` role created in init.sql.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://inventory:inventory@postgres:5432/inventory
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /srv/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./app:/srv/app
      - ./alembic:/srv/alembic
      # Uploads live outside PostgreSQL. A named volume so they survive a
      # rebuild; swap it for an S3 bucket by changing STORAGE_BACKEND.
      - uploads:/srv/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["arq", "app.infrastructure.jobs.worker.WorkerSettings"]
    # Runs the nightly low-stock sweep (07:00) and any queued jobs.
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://inventory:inventory@postgres:5432/inventory
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /srv/uploads
    volumes:
      - ./app:/srv/app
      - uploads:/srv/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads:
